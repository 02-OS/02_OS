name: Bug
description: Report a defect in 02_OS
body:
  - type: markdown
    attributes:
      value: |
        02_OS is local-first. Leave out secrets, tokens, and private repository contents.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release or commit
      description: The published GitHub release or the commit you built.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment
      description: Live image or installed system, and the command output that shows the failure.
    validations:
      required: false
