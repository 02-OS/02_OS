name: Feature
description: Suggest a change to 02_OS
body:
  - type: markdown
    attributes:
      value: |
        02_OS stays local-first. A feature request does not require an account.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do on the machine.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Change
      description: What the product should do.
    validations:
      required: true
